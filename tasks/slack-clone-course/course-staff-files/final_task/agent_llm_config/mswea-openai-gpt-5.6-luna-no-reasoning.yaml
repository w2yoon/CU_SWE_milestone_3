agent:
  system_template: 'You are a helpful assistant that can interact with a computer.


    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).

    Include a THOUGHT section before your command where you explain your reasoning process.

    Format your response as shown in <format_example>.


    <format_example>

    Your reasoning and analysis here. Explain why you want to perform the action.


    ```mswea_bash_command

    your_command_here

    ```

    </format_example>


    Failure to follow these rules will cause your response to be rejected.

    '
  instance_template: "Please solve this issue: {{task}}\n\nYou can execute bash commands and edit files to implement the necessary changes.\n\n{% if api_coverage_tool %}\n## Tool: `api-coverage`\n\nThis harness has a built-in command, `api-coverage`, that maps how much of the task's contract the running cluster serves. Start `/app/start.sh` first (in the background), then run `api-coverage` as its own command. In under 30 seconds it sends one request to every route of the API contract, checks health on all three nodes, Redis, the WebSocket (bad-token rejection, subscribe, cross-node `message.created`), the IRC gateway and the pinned `data-testid` hooks in the HTML served at `/`, and then tests about 35 key behaviour rules (permissions, validation, pagination cursors, edits and deletes, reactions, mentions, read state, search, slash commands, file limits, dense `event_id` and resume, the IRC bridge). It prints one summary line (routes OK and rules OK), a per-area score, and one line for every probe that is `DOWN`, `ERROR` (5xx), `MISSING` (route not served), `WRONG` (wrong status, missing top-level key, or a broken rule) or `SKIPPED`. `api-coverage --all` also lists the passing probes. `api-coverage --resilience` additionally SIGKILLs the process on :8001 and `redis-server` and checks that the other nodes keep serving and that `/app/start.sh` respawns both.\n\n- Run it after each group of routes you add, and use its list as your to-do list: fix `DOWN` and `ERROR` first, then `MISSING`, then `WRONG`.\n- It samples the contract, it does not cover all of it: a clean report is necessary, not sufficient. Keep working through the rest of the task text (and the UI flows) with real requests while you have time and budget.\n- Before you submit, run `api-coverage --resilience` once, then `api-coverage` again, and do not submit while either shows `DOWN`, `ERROR` or `MISSING` lines.\n\n{% endif %}{% if memory %}\n## Working memory: `/app/NOTES.md`\n\nYour context is managed for you: steps older than about 8 commands are shortened in what you see (long outputs and long file writes keep only their start and end). The files on disk are never changed by this. After every command you get a `<memory>` block with the step number, the minutes used out of 50, the cost so far out of the budget, and the current content of `/app/NOTES.md`.\n\n- Create `/app/NOTES.md` in your first few commands, and keep it under about 60 lines: your plan as a checklist of the contract areas, which areas are done and verified, what is failing now, and the facts you will need later (file layout, how the cluster starts, ports, pitfalls you found).\n- Update it (rewrite it or append a line) whenever you finish or verify an area, find a bug, or change plan, so that it stays true even after old steps are shortened.\n- Use the meter to pace yourself: have a working cluster early, cover every area before polishing one, and stop adding features with about 8 minutes or 10% of the budget left so you can verify and submit.\n- The full 50 minutes and budget are yours to use. A submit sent while less than 60% of both the time and the budget is used is held back (up to 3 times), and you are asked to check your notes against the task first. Use that time to test the rules and UI flows you have not tested yet.\n\n{% endif %}## Recommended Workflow\n\nThis workflow should be done step-by-step so that you can iterate on your changes and any possible problems.\n\n1. Analyze the codebase by finding and reading relevant files\n2. Create a script to reproduce the issue\n3. Edit the source code to resolve the issue\n4. Verify your fix works by running your script again\n5. Test edge cases to ensure your fix is robust\n6. Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.\n   Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>\n\n## Important Rules\n\n1. Every response must contain exactly one action\n2. The action must be enclosed in triple backticks\n3. Directory or environment variable changes are not persistent. Every action is executed in a new subshell.\n   However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files\n\n<system_information>\n{{system}} {{release}} {{version}} {{machine}}\n</system_information>\n\n## Formatting your response\n\nHere is an example of a correct response:\n\n<example_response>\nTHOUGHT: I need to understand the structure of the repository first. Let me check what files are in the current directory to get a better understanding of the codebase.\n\n```mswea_bash_command\nls -la\n```\n</example_response>\n\n## Useful command examples\n\n### Create a new file:\n\n```mswea_bash_command\ncat <<'EOF' > newfile.py\nimport numpy as np\nhello = \"world\"\nprint(hello)\nEOF\n```\n\n### Edit files with sed:\n\n{%- if system == \"Darwin\" -%}\n<important>\nYou are on MacOS. For all the below examples, you need to use `sed -i ''` instead of `sed -i`.\n</important>\n{%- endif -%}\n\n```mswea_bash_command\n# Replace all occurrences\nsed -i 's/old_string/new_string/g' filename.py\n\n# Replace only first occurrence\nsed -i 's/old_string/new_string/' filename.py\n\n# Replace first occurrence on line 1\nsed -i '1s/old_string/new_string/' filename.py\n\n# Replace all occurrences in lines 1-10\nsed -i '1,10s/old_string/new_string/g' filename.py\n```\n\n### View file content:\n\n```mswea_bash_command\n# View specific lines with numbers\nnl -ba filename.py | sed -n '10,20p'\n```\n\n### Any other command you want to run\n\n```mswea_bash_command\nanything\n```\n"
  step_limit: 0
  cost_limit: 0
  # Milestone 3 improvements (see report.md): true/false per experiment setting.
  api_coverage_tool: true
  memory: true
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: '{% if output.exception_info -%}

    <exception>{{output.exception_info}}</exception>

    {% endif -%}

    <returncode>{{output.returncode}}</returncode>

    {% if output.output | length < 10000 -%}

    <output>

    {{ output.output -}}

    </output>

    {%- else -%}

    <warning>

    The output of your last command was too long.

    Please try a different command that produces less output.

    If you''re looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.

    If you''re using grep or find and it produced too much output, you can use a more selective search pattern.

    If you really need to see something from the full command''s output, you can redirect output to a file and then search in that file.

    </warning>

    {%- set elided_chars = output.output | length - 10000 -%}

    <output_head>

    {{ output.output[:5000] }}

    </output_head>

    <elided_chars>

    {{ elided_chars }} characters elided

    </elided_chars>

    <output_tail>

    {{ output.output[-5000:] }}

    </output_tail>

    {%- endif -%}

    '
  model_kwargs:
    drop_params: true
    # AIDEV-NOTE: cap output so a verbose inline file-write can't be truncated at a low
    # default max output (finish_reason=length -> RepeatedFormatError). GPT 5.6 Luna has
    # a huge context (~922k) and 128k max output, so 16k output is comfortable headroom.
    max_tokens: 16384
    # AIDEV-NOTE: direct OpenAI API variant of the openrouter gpt-5.6-luna config; no
    # reasoning params are sent (same as openrouter/bedrock), and no OpenRouter provider
    # routing block since requests go straight to OpenAI.
  # AIDEV-NOTE: pricing carried over from the AWS Bedrock In-Region gpt-5.6-luna config
  # ($0.22/1M in, $1.32/1M out). OpenAI's direct rates may differ -- confirm against
  # OpenAI's pricing page and update if cost tracking must be exact. Explicit per-token
  # prices (litellm_textbased -> custom_cost_per_token).
  input_cost_per_token: 2.2e-07
  output_cost_per_token: 1.32e-06
  format_error_template: |-
    {% if finish_reason is defined and finish_reason in ["length", "tool_calls"] -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a complete action, so it was cut off. Respond more concisely and provide exactly one action in the required format. If you need to think more, do so briefly.
    {%- else -%}
    Format error: your reply contained {{ actions|length }} command block(s), but each reply must contain EXACTLY ONE.

    <error>
    {{ error }}
    </error>

    Send only ONE ```mswea_bash_command block this turn; do everything else in later replies. You may chain steps inside that single command with && or ||.

    ❌ WRONG — several command blocks in one reply (this is exactly what was just rejected):
    ```mswea_bash_command
    first command
    ```
    ```mswea_bash_command
    second command
    ```

    ✅ CORRECT — exactly one block, then stop and wait for its output before your next command:
    ```mswea_bash_command
    your single command here
    ```

    If you have completed your assignment, consult the first message about how to submit (you cannot continue after that).
    {%- endif %}
  model_class: litellm_textbased
  cost_tracking: ignore_errors
